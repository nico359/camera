[package]
name = "camera"
version = "0.4.0"
edition = "2021"

[features]
default = []
# Camera2 is only meaningful on Halium devices (FuriOS/FuriPhone).  It is
# enabled explicitly by the Flatpak build; desktop builds use the no-camera
# backend and still compile the GTK UI.
camera2 = []

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "location"] }
futures-util = "0.3"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.9", package = "gtk4", features = ["gnome_47"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
little_exif = "0.6.23"
tokio = { version = "1", features = ["rt", "macros"] }

[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_6"]

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
